spring.application.name=api-gateway
server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

management.endpoints.web.exposure.include=health,info,gateway


# =========================
# Gateway Routes
# =========================

spring.cloud.gateway.server.webmvc.routes[0].id=auth-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://auth-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/auth/**,/users/**

spring.cloud.gateway.server.webmvc.routes[1].id=movie-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://movie-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/movies/**

spring.cloud.gateway.server.webmvc.routes[2].id=watchlist-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://watchlist-service
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/watchlist/**

spring.cloud.gateway.server.webmvc.routes[3].id=rating-service
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://rating-service
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/ratings/**

spring.cloud.gateway.server.webmvc.routes[4].id=history-service
spring.cloud.gateway.server.webmvc.routes[4].uri=lb://history-service
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/history/**


